<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160" font-family="ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, Menlo, Consolas, monospace">
<style>
  .bg { fill: #f4f3ef; }
  .grid { stroke: #dedbd3; stroke-width: 0.5; }
  .grid-major { stroke: #cbc7bd; stroke-width: 0.5; }
  .box { fill: #e9e7e1; stroke: #2b2a26; stroke-width: 1; }
  .box-label { fill: #2b2a26; }
  .stroke { fill: #2b2a26; }
  .hop { stroke: #2b2a26; }
  .free-text { fill: #6b6862; }
  .hit-S0 { fill: #8a5b56; opacity: 0.30; }
  .hit-S1 { fill: #96755c; opacity: 0.28; }
  .hit-S2 { fill: #87805a; opacity: 0.24; }
  .hit-S3 { fill: #4a6572; opacity: 0.20; }
  .dimmed { fill: url(#tp-stipple); }
  .dither-run { fill: #2b2a26; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1917; }
    .grid { stroke: #2e2c28; }
    .grid-major { stroke: #3d3a35; }
    .box { fill: #232220; stroke: #dedbd3; }
    .box-label { fill: #dedbd3; }
    .free-text { fill: #9a968d; }
    .stroke { fill: #dedbd3; }
    .hop { stroke: #dedbd3; }
  }
</style>
<defs>
  <!-- Grey earned by pattern rather than assumed. The stipple is drawn at the
       5px quadrant so a dimmed element is made of the same units as every
       other mark on the page. -->
  <pattern id="tp-stipple" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="5" height="5" fill="#2b2a26"/>
    <rect x="5" y="5" width="5" height="5" fill="#2b2a26"/>
  </pattern>
</defs>
<rect class="bg" x="0" y="0" width="240" height="160"/>
<g transform="translate(20,20)"><line class="grid" x1="-40" y1="-40" x2="-40" y2="160"/><line class="grid" x1="-30" y1="-40" x2="-30" y2="160"/><line class="grid" x1="-20" y1="-40" x2="-20" y2="160"/><line class="grid" x1="-10" y1="-40" x2="-10" y2="160"/><line class="grid-major" x1="0" y1="-40" x2="0" y2="160"/><line class="grid" x1="10" y1="-40" x2="10" y2="160"/><line class="grid" x1="20" y1="-40" x2="20" y2="160"/><line class="grid" x1="30" y1="-40" x2="30" y2="160"/><line class="grid" x1="40" y1="-40" x2="40" y2="160"/><line class="grid" x1="50" y1="-40" x2="50" y2="160"/><line class="grid" x1="60" y1="-40" x2="60" y2="160"/><line class="grid" x1="70" y1="-40" x2="70" y2="160"/><line class="grid" x1="80" y1="-40" x2="80" y2="160"/><line class="grid" x1="90" y1="-40" x2="90" y2="160"/><line class="grid-major" x1="100" y1="-40" x2="100" y2="160"/><line class="grid" x1="110" y1="-40" x2="110" y2="160"/><line class="grid" x1="120" y1="-40" x2="120" y2="160"/><line class="grid" x1="130" y1="-40" x2="130" y2="160"/><line class="grid" x1="140" y1="-40" x2="140" y2="160"/><line class="grid" x1="150" y1="-40" x2="150" y2="160"/><line class="grid" x1="160" y1="-40" x2="160" y2="160"/><line class="grid" x1="170" y1="-40" x2="170" y2="160"/><line class="grid" x1="180" y1="-40" x2="180" y2="160"/><line class="grid" x1="190" y1="-40" x2="190" y2="160"/><line class="grid-major" x1="200" y1="-40" x2="200" y2="160"/><line class="grid" x1="210" y1="-40" x2="210" y2="160"/><line class="grid" x1="220" y1="-40" x2="220" y2="160"/><line class="grid" x1="230" y1="-40" x2="230" y2="160"/><line class="grid" x1="240" y1="-40" x2="240" y2="160"/><line class="grid" x1="-40" y1="-40" x2="240" y2="-40"/><line class="grid" x1="-40" y1="-30" x2="240" y2="-30"/><line class="grid" x1="-40" y1="-20" x2="240" y2="-20"/><line class="grid" x1="-40" y1="-10" x2="240" y2="-10"/><line class="grid-major" x1="-40" y1="0" x2="240" y2="0"/><line class="grid" x1="-40" y1="10" x2="240" y2="10"/><line class=