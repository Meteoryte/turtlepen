  .hit-S1 { fill: #96755c; opacity: 0.28; }
  .hit-S2 { fill: #87805a; opacity: 0.24; }
  .hit-S3 { fill: #4a6572; opacity: 0.20; }
  .dimmed { fill: url(#tp-stipple); }
  .dither-run { fill: #2b2a26; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1917; }
    .grid { stroke: #2e2c28; }
    .grid-major { stroke: #3d3a35; }
    .box { fill: #232220; stroke: #dedbd3; }
    .box-label { fill: #dedbd3; }
    .free-text { fill: #9a968d; }
    .stroke { fill: #dedbd3; }
    .hop { stroke: #dedbd3; }
  }
</style>
<defs>
  <!-- Grey earned by pattern rather than assumed. The stipple is drawn at the
       5px quadrant so a dimmed element is made of the same units as every
       other mark on the page. -->
  <pattern id="tp-stipple" width="10" height="10" patternUnits="userSpaceOnUse">
    <rect width="5" height="5" fill="#2b2a26"/>
    <rect x="5" y="5" width="5" height="5" fill="#2b2a26"/>
  </pattern>
</defs>
