<svg xmlns="http://www.w3.org/2000/svg" width="480" height="205" viewBox="0 0 480 205" font-family="ui-monospace, SFMono-Regular, &quot;Cascadia Mono&quot;, Menlo, Consolas, monospace">
<style>
  .bg { fill: #f4f3ef; }
  .grid { stroke: #dedbd3; stroke-width: 0.5; }
  .grid-major { stroke: #cbc7bd; stroke-width: 0.5; }
  .box { fill: #e9e7e1; stroke: #2b2a26; stroke-width: 1; }
  .box-label { fill: #2b2a26; }
  .stroke { fill: #2b2a26; }
  .hop { stroke: #2b2a26; }
  .free-text { fill: #6b6862; }
