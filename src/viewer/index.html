<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TurtlePen live editor</title>
<link rel="icon" href="/brand-logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <img class="brand-mark" src="/brand-logo.svg" alt="">
  <div class="identity">
    <h1>TurtlePen</h1>
    <span class="meta" id="doc">Connecting</span>
  </div>
  <span class="connection" id="connection" data-state="connecting" aria-live="polite">Connecting</span>
  <label class="zoom-control">Zoom
    <select id="zoom" aria-label="Canvas zoom">
      <option value="fit" selected>Fit</option>
      <option value="50">50%</option>
      <option value="75">75%</option>
      <option value="100">100%</option>
      <option value="150">150%</option>
      <option value="200">200%</option>
    </select>
  </label>
  <div class="history-actions" aria-label="Edit history">
    <button type="button" id="undo" title="Undo" disabled>Undo</button>
    <button type="button" id="redo" title="Redo" disabled>Redo</button>
  </div>
  <span class="counts" id="counts" aria-live="polite"></span>
</header>
<div class="operation" id="operation" aria-live="polite"></div>
<main>
  <section id="stage" aria-label="Diagram canvas" tabindex="0"></section>
  <aside>
    <section class="panel-section">
      <h2>Pages</h2>
      <div id="pages" class="pages"></div>
    </section>
    <section class="panel-section">
      <h2>Selection</h2>
      <div id="inspector" class="empty">No selection</div>
    </section>
    <section class="panel-section">
      <h2>Collision log</h2>
      <div id="log" class="empty" aria-live="polite">Waiting for document state</div>
    </section>
    <section class="panel-section">
      <details><summary>Quadrant view</summary><pre id="ascii"></pre></details>
    </section>
  </aside>
</main>
</body>
</html>
