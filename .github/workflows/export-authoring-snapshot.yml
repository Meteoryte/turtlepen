name: Export TurtlePen authoring snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-authoring-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove generated heavy artifacts from authoring copy
        run: |
          rm -f brand/logo-redesign.turtlepen.json brand/logo.turtlepen.json brand/logo-v2.turtlepen.json
          rm -f brand/logo-redesign-preview.png
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: turtlepen-authoring-snapshot
          path: |
            package.json
            pnpm-lock.yaml
            src/
            examples/
            brand/
          if-no-files-found: error
          retention-days: 1
