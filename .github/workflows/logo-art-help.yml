name: Probe TurtlePen MCP art help

on:
  push:
    branches: [main]
    paths:
      - 'examples/logo-art-help.js'
      - '.github/workflows/logo-art-help.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Query TurtlePen through its MCP help tools
        run: node examples/logo-art-help.js
      - name: Commit help evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add brand/logo-art-help.md
          if git diff --cached --quiet; then
            echo 'No help changes to commit.'
            exit 0
          fi
          git commit -m 'Capture TurtlePen MCP art help for logo rebuild'
          git push
