name: Build TurtlePen MCP logo redesign

on:
  push:
    branches: [main]
    paths:
      - 'examples/logo-help-explorer.js'
      - 'examples/logo-redesign-mcp.js'
      - '.github/workflows/build-logo-redesign.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-logo-redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Explore TurtlePen through MCP help
        run: node examples/logo-help-explorer.js

      - name: Correct authoring source against live MCP contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('examples/logo-redesign-mcp.js')
          s = p.read_text()
          old = "const q = (x, y, pin = 'c') => `${colName(Math.max(1, Math.ceil(x / 2)))}${Math.max(1, Math.ceil(y / 2))}.${pin}`;"
          if old in s:
              new = """const q = (x, y, pin = null) => {
                const col = Math.floor(x / 2);
                const row = Math.floor(y / 2);
                if (pin) return `${colName(col + 1)}${row + 1}.${pin}`;
                const qx = x - col * 2;
                const qy = y - row * 2;
                const part = qy === 0 ? (qx === 0 ? 'q1' : 'q2') : (qx === 0 ? 'q3' : 'q4');
                return `${colName(col + 1)}${row + 1}.${part}`;
              };"""
              s = s.replace(old, new)
          s = s.replace("source: 'brand/logo-v2-source-mark.png'", "source: 'logo-v2-source-mark.png'")
          s = s.replace("maxWidthCells: 78, maxHeightCells: 86", "maxWidthCells: 78")
          p.write_text(s)
          PY

      - name: Build through the real TurtlePen MCP server
        run: node examples/logo-redesign-mcp.js

      - name: Verify generated artifacts exist
        run: |
          test -s brand/logo-redesign.turtlepen.json
          test -s brand/logo-redesign.svg

      - name: Commit corrected source and generated TurtlePen artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add examples/logo-redesign-mcp.js brand/logo-redesign.turtlepen.json brand/logo-redesign.svg
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Generate traced TurtlePen MCP logo redesign'
          git push
